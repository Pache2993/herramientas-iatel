ansition-duration: 0.06s; }\\n        .ia-btn { overflow: hidden; }\\n        .ia-btn:focus-visible, .ia-menu-item:focus-visible, .ia-icon-btn:focus-visible { outline: 2px solid var(--ia-brand-500); outline-offset: 1px; }\\n        .ia-btn.is-active { color: var(--ia-brand-500); border-left-color: var(--ia-brand-500); background-color: var(--ia-brand-soft); box-shadow: inset 0 0 12px rgba(0, 153, 255, 0.05); }\\n        .ia-btn--primary { background-color: var(--ia-brand-500); border-color: var(--ia-brand-500); color: #fff; }\\n        .ia-btn--primary:hover { background-color: var(--ia-brand-600); border-color: var(--ia-brand-600); color: #fff; box-shadow: 0 0 14px var(--ia-brand-glow); }\\n        .ia-btn:disabled { opacity: 0.5; cursor: not-allowed; }\\n        /* Estados del bot\\u00f3n: el propio bot\\u00f3n muestra el progreso y el resultado */\\n        .ia-btn.is-busy { color: var(--ia-brand-500); border-color: var(--ia-border); border-left-color: var(--ia-brand-500); background-color: var(--ia-brand-soft); pointer-events: none; cursor: progress; }\\n        .ia-btn.is-success { color: var(--ia-success); border-color: var(--ia-border); border-left-color: var(--ia-success); background-color: rgba(63, 185, 80, 0.12); box-shadow: none; }\\n        .ia-btn.is-warning { color: var(--ia-warning); border-color: var(--ia-border); border-left-color: var(--ia-warning); background-color: rgba(210, 153, 34, 0.12); box-shadow: none; }\\n\\n        /* ---------- MEN\\u00da DESPLEGABLE ---------- */\\n        .ia-menu { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background-color: var(--ia-surface-raised); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--ia-border); border-radius: var(--ia-r-lg); width: max-content; box-shadow: var(--ia-sh-menu); z-index: var(--ia-z-menu); padding: var(--ia-sp-2); animation: ia-menu-in 0.18s var(--ia-ease); }\\n        .ia-menu-item { display: block; width: 100%; background: transparent; color: var(--ia-text-2); border: none; border-left: 2px solid transparent; padding: 7px var(--ia-sp-4); cursor: pointer; text-align: left; font-family: inherit; font-size: var(--ia-fs-sm); font-weight: 500; border-radius: var(--ia-r-sm); transition: all 0.15s ease; white-space: nowrap; }\\n        .ia-menu-item:hover { color: var(--ia-brand-500); border-left-color: var(--ia-brand-500); background-color: var(--ia-brand-soft); padding-left: 14px; }\\n        .ia-menu-item.is-active { color: var(--ia-brand-500); border-left-color: var(--ia-brand-500); background-color: var(--ia-brand-soft); font-weight: 600; }\\n        /* Grupos dentro de un men\\u00fa: encabezado fijo al hacer scroll + opciones sangradas */\\n        .ia-menu-group { position: sticky; top: calc(-1 * var(--ia-sp-2)); z-index: 1; display: flex; align-items: center; gap: var(--ia-sp-2); margin: var(--ia-sp-2) calc(-1 * var(--ia-sp-2)) 2px; padding: var(--ia-sp-3) var(--ia-sp-4) var(--ia-sp-2); background-color: var(--ia-surface-solid); border-top: 1px solid var(--ia-border); font-size: var(--ia-fs-xs); font-weight: 700; letter-spacing: 0.2px; color: var(--ia-text); }\\n        .ia-menu-group::before { content: \\\"\\\"; width: 3px; height: 12px; border-radius: 2px; background-color: var(--ia-brand-500); }\\n        .ia-menu-group-count { margin-left: auto; font-weight: 500; color: var(--ia-text-3); }\\n        .ia-menu-section { position: relative; }\\n        .ia-menu-item--grouped { padding-left: 22px; }\\n        .ia-menu-item--grouped:hover { padding-left: 26px; }\\n        .ia-menu-item--custom { display: flex; align-items: center; gap: var(--ia-sp-2); color: var(--ia-brand-500); font-weight: 600; }\\n        .ia-menu-sep { height: 1px; margin: var(--ia-sp-1) 0; background-color: var(--ia-border); }\\n\\n        /* Desplegable de campo: mismo bot\\u00f3n y mismo men\\u00fa que Refresh */\\n        .ia-dd { position: relative; width: 100%; }\\n        .ia-dd-trigger { width: 100%; justify-content: space-between; border-color: var(--ia-border); background-color: var(--ia-field); font-weight: 500; font-size: var(--ia-fs-sm); }\\n        .ia-dd-label { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--ia-sp-1); text-align: left; overflow: hidden; }\\n        .ia-dd-text { overflow: hidden; text-overflow: ellipsis; }\\n        .ia-dd-group { flex: none; color: var(--ia-text-3); font-weight: 600; }\\n        .ia-dd-label .ia-icon { color: var(--ia-text-3); }\\n        .ia-dd.is-placeholder .ia-dd-label { color: var(--ia-text-3); }\\n        .ia-dd-menu { position: fixed; transform: none; max-width: 92vw; overflow-y: auto; animation: ia-dd-in 0.15s var(--ia-ease); }\\n\\n        /* ---------- INDICADOR DE ESTADO (punto) ---------- */\\n        .ia-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--ia-dot-off); margin-left: var(--ia-sp-1); display: inline-block; transition: background-color 0.25s ease, box-shadow 0.25s ease; }\\n        .ia-dot.is-on { background-color: var(--ia-brand-500); box-shadow: 0 0 6px var(--ia-brand-glow); }\\n        .ia-pulse { animation: ia-pulse 0.3s var(--ia-ease); }\\n\\n        /* ---------- INDICADOR DE CARGA ---------- */\\n        .ia-spinner { width: 10px; height: 10px; flex: none; border-radius: 50%; border: 2px solid var(--ia-brand-glow); border-top-color: var(--ia-brand-500); animation: ia-spin 0.7s linear infinite; }\\n\\n        /* ---------- MODAL ---------- */\\n        .ia-overlay { display: none; position: fixed; inset: 0; background: var(--ia-overlay); z-index: var(--ia-z-modal); align-items: center; justify-content: center; font-family: var(--ia-font); }\\n        .ia-modal { background-color: var(--ia-surface-modal); border: 1px solid var(--ia-border); border-radius: var(--ia-r-xl); padding: var(--ia-sp-6); width: 440px; max-width: 92vw; max-height: 90vh; overflow-y: auto; box-shadow: var(--ia-sh-modal); color: var(--ia-text); }\\n        .ia-modal-title { font-size: var(--ia-fs-lg); font-weight: 700; margin-bottom: var(--ia-sp-5); color: var(--ia-brand-500); display: flex; align-items: center; gap: var(--ia-sp-2); }\\n        .ia-modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }\\n        .ia-section + .ia-modal-footer { margin-top: var(--ia-sp-5); }\\n        .ia-section-label { font-size: var(--ia-fs-xs); font-weight: 600; margin-bottom: var(--ia-sp-3); color: var(--ia-text-2); }\\n        .ia-section-label--accent { color: var(--ia-brand-500); display: flex; align-items: center; gap: var(--ia-sp-1); }\\n\\n        /* ---------- CAMPOS ---------- */\\n        .ia-field { margin-bottom: var(--ia-sp-5); display: flex; flex-direction: column; gap: var(--ia-sp-2); }\\n        .ia-field--divided { border-top: 1px solid var(--ia-border); padding-top: var(--ia-sp-5); }\\n        .ia-label { font-size: var(--ia-fs-xs); color: var(--ia-text-2); font-weight: 600; }\\n        .ia-control { background-color: var(--ia-field); border: 1px solid var(--ia-border); color: var(--ia-text); border-radius: var(--ia-r-md); padding: 0 10px; height: 30px; font-size: var(--ia-fs-xs); font-weight: 500; font-family: inherit; outline: none; width: 100%; transition: border-color 0.2s; }\\n        .ia-control:focus { border-color: var(--ia-border-focus); box-shadow: 0 0 0 2px rgba(0, 153, 255, 0.15); }\\n        textarea.ia-control { height: auto; min-height: 75px; padding: var(--ia-sp-3) 10px; resize: vertical; }\\n        .ia-capture { font-family: var(--ia-mono); font-size: var(--ia-fs-sm); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ia-brand-500); cursor: pointer; }\\n        .ia-capture::placeholder { color: var(--ia-text-3); font-weight: 500; font-family: var(--ia-font); font-size: var(--ia-fs-xs); letter-spacing: 0; text-transform: none; }\\n\\n        /* ---------- SUBPANEL (opciones que dependen de una selecci\\u00f3n) ---------- */\\n        .ia-subpanel { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; padding: var(--ia-sp-4); background-color: rgba(0, 153, 255, 0.05); border: 1px solid var(--ia-border); border-left: 2px solid var(--ia-brand-500); border-radius: var(--ia-r-md); animation: ia-dd-in 0.15s var(--ia-ease); }\\n        .ia-subpanel-head { display: flex; align-items: center; gap: var(--ia-sp-2); font-size: var(--ia-fs-xs); font-weight: 700; color: var(--ia-brand-500); }\\n        .ia-subrow { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: var(--ia-sp-3); }\\n        .ia-subrow--stack { grid-template-columns: 1fr; gap: var(--ia-sp-2); }\\n        .ia-sublabel { font-size: var(--ia-fs-xs); font-weight: 600; color: var(--ia-text-2); }\\n        .ia-subgrid { display: flex; flex-direction: column; gap: var(--ia-sp-3); }\\n        .ia-is-off { display: none !important; }\\n        .ia-optional { font-weight: 500; color: var(--ia-text-3); }\\n        .ia-upper { text-transform: uppercase; }\\n        .ia-upper::placeholder { text-transform: none; }\\n        .ia-hint { display: flex; align-items: center; gap: var(--ia-sp-1); font-size: var(--ia-fs-xs); color: var(--ia-brand-500); }\\n        .ia-hint--muted { color: var(--ia-text-3); }\\n\\n        /* ---------- LISTA DE ATAJOS ---------- */\\n        .ia-section { display: flex; flex-direction: column; gap: var(--ia-sp-3); }\\n        .ia-section + .ia-section { margin-top: var(--ia-sp-5); padding-top: var(--ia-sp-5); border-top: 1px solid var(--ia-border); }\\n        .ia-section-head { display: flex; align-items: center; gap: var(--ia-sp-2); font-size: var(--ia-fs-xs); font-weight: 700; color: var(--ia-text); }\\n        .ia-section-head .ia-icon { color: var(--ia-brand-500); }\\n        .ia-count { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ia-brand-soft); border: 1px solid var(--ia-brand-glow); color: var(--ia-brand-500); font-size: var(--ia-fs-2xs); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }\\n        .ia-shortcut-list { max-height: 196px; overflow-y: auto; display: flex; flex-direction: column; gap: var(--ia-sp-2); }\\n        .ia-empty { padding: var(--ia-sp-4); border: 1px dashed var(--ia-border-strong); border-radius: var(--ia-r-md); color: var(--ia-text-3); font-size: var(--ia-fs-xs); text-align: center; }\\n        .ia-shortcut { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: var(--ia-sp-2) var(--ia-sp-2) var(--ia-sp-2) var(--ia-sp-4); background: var(--ia-field); border: 1px solid var(--ia-border); border-left: 2px solid var(--ia-brand-500); border-radius: var(--ia-r-md); transition: border-color 0.15s ease, background-color 0.15s ease; }\\n        .ia-shortcut:hover { background-color: var(--ia-hover); border-color: var(--ia-border-strong); border-left-color: var(--ia-brand-500); }\\n        .ia-kbd-group { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--ia-text-3); font-size: var(--ia-fs-2xs); }\\n        .ia-kbd { font-family: var(--ia-mono); background: var(--ia-brand-soft); color: var(--ia-brand-500); padding: 2px var(--ia-sp-2); border-radius: var(--ia-r-sm); font-size: var(--ia-fs-xs); font-weight: 700; border: 1px solid var(--ia-brand-glow); }\\n        .ia-shortcut-desc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }\\n        .ia-shortcut-main { font-size: var(--ia-fs-sm); font-weight: 600; color: var(--ia-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\\n        .ia-shortcut-sub { font-size: var(--ia-fs-xs); color: var(--ia-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\\n        .ia-capture-wrap { position: relative; display: flex; align-items: center; }\\n        .ia-capture-wrap .ia-icon { position: absolute; left: 10px; color: var(--ia-text-3); pointer-events: none; }\\n        .ia-capture-wrap .ia-control { padding-left: 32px; }\\n        .ia-icon-btn { flex: none; width: 28px; height: 28px; background: transparent; border: 1px solid transparent; color: var(--ia-text-3); cursor: pointer; border-radius: var(--ia-r-sm); display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s ease; }\\n        .ia-icon-btn:hover { color: var(--ia-danger); background: rgba(248, 81, 73, 0.1); border-color: rgba(248, 81, 73, 0.3); }\\n\\n        /* ---------- MOVIMIENTO ---------- */\\n        @keyframes ia-menu-in { from { opacity: 0; transform: translate(-50%, -4px); } to { opacity: 1; transform: translate(-50%, 0); } }\\n        @keyframes ia-pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }\\n        @keyframes ia-spin { to { transform: rotate(360deg); } }\\n        @keyframes ia-dd-in { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-dd-in-up { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-bar-in { from { opacity: 0; transform: translateY(-14px) scale(0.98); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-item-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-reveal { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-fade { from { opacity: 0; } to { opacity: 1; } }\\n        @keyframes ia-modal-in { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-swap-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-pop { from { opacity: 0; transform: scale(0.3) rotate(-25deg); } to { opacity: 1; transform: none; } }\\n        @keyframes ia-ring-ok { from { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5); } to { box-shadow: 0 0 0 9px rgba(63, 185, 80, 0); } }\\n        @keyframes ia-shake { 15%, 55% { transform: translateX(-3px); } 35%, 75% { transform: translateX(3px); } 100% { transform: none; } }\\n        @keyframes ia-autofill { from { border-color: var(--ia-brand-500); box-shadow: 0 0 0 0 rgba(0, 153, 255, 0.55); } to { box-shadow: 0 0 0 7px rgba(0, 153, 255, 0); } }\\n        @keyframes ia-flash { from { background-color: rgba(0, 153, 255, 0.22); border-color: var(--ia-brand-500); } }\\n\\n        /* Barra: entra desde arriba y sus elementos aparecen escalonados */\\n        .ia-toolbar { animation: ia-bar-in 0.5s var(--ia-ease) backwards; }\\n        .ia-toolbar > * { animation: ia-rise 0.45s var(--ia-ease) backwards; }\\n        .ia-toolbar > :nth-child(2) { animation-delay: 0.06s; } .ia-toolbar > :nth-child(3) { animation-delay: 0.10s; }\\n        .ia-toolbar > :nth-child(4) { animation-delay: 0.14s; } .ia-toolbar > :nth-child(5) { animation-delay: 0.18s; }\\n        .ia-toolbar > :nth-child(6) { animation-delay: 0.22s; } .ia-toolbar > :nth-child(7) { animation-delay: 0.26s; }\\n        /* Iconos de bot\\u00f3n: peque\\u00f1o gesto al pasar el rat\\u00f3n */\\n        .ia-btn .ia-icon { transition: transform 0.3s var(--ia-ease); }\\n        .ia-btn:hover > .ia-icon:first-child { transform: translateY(-1px); }\\n        .ia-btn:hover > .ia-icon[data-i=\\\"refresh\\\"] { transform: rotate(-90deg); }\\n        .ia-btn:hover > .ia-icon[data-i=\\\"escalate\\\"] { transform: translate(1.5px, -1.5px); }\\n        .ia-btn:hover > .ia-icon[data-i=\\\"check-circle\\\"], .ia-btn:hover > .ia-icon[data-i=\\\"table\\\"] { transform: scale(1.12); }\\n        .ia-icon[data-i=\\\"chevron\\\"] { transition: transform 0.25s var(--ia-ease); }\\n        [aria-expanded=\\\"true\\\"] > .ia-icon[data-i=\\\"chevron\\\"] { transform: rotate(180deg); }\\n        /* Men\\u00fas: se despliegan desde el bot\\u00f3n y sus opciones entran escalonadas */\\n        .ia-menu { transform-origin: top center; }\\n        .ia-dd-menu { transform-origin: top left; }\\n        .ia-dd-menu.is-up { animation-name: ia-dd-in-up; transform-origin: bottom left; }\\n        .ia-menu > * { animation: ia-item-in 0.24s var(--ia-ease) backwards; }\\n        .ia-menu > :nth-child(2) { animation-delay: 0.02s; } .ia-menu > :nth-child(3) { animation-delay: 0.04s; }\\n        .ia-menu > :nth-child(4) { animation-delay: 0.06s; } .ia-menu > :nth-child(5) { animation-delay: 0.08s; }\\n        .ia-menu > :nth-child(6) { animation-delay: 0.10s; } .ia-menu > :nth-child(n+7) { animation-delay: 0.12s; }\\n        /* Estados del bot\\u00f3n: el texto nuevo entra, el \\u00e9xito \\\"salta\\\" con un halo y el aviso se sacude */\\n        .ia-btn.is-busy > span:not(.ia-spinner), .ia-btn.is-success > *, .ia-btn.is-warning > * { animation: ia-swap-in 0.24s var(--ia-ease) backwards; }\\n        .ia-btn.is-success > .ia-icon { animation: ia-pop 0.45s var(--ia-ease-pop) backwards; }\\n        .ia-btn.is-success { animation: ia-ring-ok 0.7s ease-out; }\\n        .ia-btn.is-warning { animation: ia-shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }\\n        /* Modales: fondo con fundido, ventana que sube y contenido escalonado */\\n        .ia-overlay { animation: ia-fade 0.2s ease-out; }\\n        .ia-overlay > .ia-modal { animation: ia-modal-in 0.34s var(--ia-ease); }\\n        .ia-modal > * { animation: ia-rise 0.38s var(--ia-ease) backwards; }\\n        .ia-modal > :nth-child(1) { animation-delay: 0.04s; } .ia-modal > :nth-child(2) { animation-delay: 0.07s; }\\n        .ia-modal > :nth-child(3) { animation-delay: 0.10s; } .ia-modal > :nth-child(4) { animation-delay: 0.13s; }\\n        .ia-modal > :nth-child(n+5) { animation-delay: 0.16s; }\\n        /* Campos que aparecen se function montarSimulador(raiz) {
    $$('.ws-sim', raiz).forEach(caja => {
        let id = caja.dataset.sim, frame = null;
        const vp = $('[data-viewport]', caja), side = $('[data-side]', caja), browser = $('[data-browser]', caja);
        side.innerHTML = ladoSimulador(id);
        const escalar = () => {
            const w = vp.clientWidth, k = w / 1280;
            vp.style.height = Math.round(720 * k) + 'px';
            if (frame) frame.style.transform = `scale(${k})`;
        };
        const cargar = () => {
            if (frame) frame.remove();
            frame = document.createElement('iframe');
            frame.className = 'ws-frame';
            frame.title = 'Simulador de ' + SIMS[id].nombre;
            frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
            frame.srcdoc = docSim(id);
            vp.appendChild(frame);
            escalar();
            frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
            $('[data-done]', side).hidden = true;
        };
        const poner = (nuevo, arrancar) => {
            id = nuevo; caja.dataset.sim = id;
            $$('.ws-sim-tab', caja).forEach(t => { const on = t.dataset.k === id; t.classList.toggle('is-on', on); t.setAttribute('aria-selected', on); });
            $('[data-url-h]', caja).textContent = SIMS[id].url[0]; $('[data-url-p]', caja).textContent = SIMS[id].url[1];
            side.innerHTML = ladoSimulador(id);
            anim(side, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
            const p = $('[data-poster]', caja);
            if (arrancar) { if (p) p.remove(); cargar(); }
            else if (p) { $('[data-p-nombre]', p).textContent = SIMS[id].nombre; }
            if (location.hash.startsWith('#/simulador')) history.replaceState(null, '', '#/simulador/' + id);
        };
        $$('.ws-sim-tab', caja).forEach(t => t.onclick = () => poner(t.dataset.k, !$('[data-poster]', caja)));
        $('[data-poster]', caja).onclick = () => poner(id, true);
        $('[data-reiniciar]', caja).onclick = () => { const p = $('[data-poster]', caja); if (p) p.remove(); cargar(); };
        $('[data-completa]', caja).onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (browser.requestFullscreen) browser.requestFullscreen(); };
        document.addEventListener('fullscreenchange', () => requestAnimationFrame(escalar));
        new ResizeObserver(escalar).observe(vp);
        // La simulación avisa cuando termina el recorrido principal
        window.addEventListener('message', (e) => {
            if (!frame || e.source !== frame.contentWindow || !e.data || !e.data.sim) return;
            if (e.data.tipo === 'fin') { const d = $('[data-done]', side); d.hidden = false; anim(d, [{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }); }
        });
        escalar();
    });
}

/b> para continuar.', true); inp.focus(); return; }\n            enviando = true;\n            mensaje(null); $('.field').classList.remove('is-bad');\n            GM_setValue(\"oceane_clave\", clave);\n            paso(1, 'is-run'); estadoTarjeta('is-busy'); boton('busy', 'Verificando licencia…');\n            inp.disabled = true;\n            validar({\n                ok: (herramientas, continuar) => {\n                    sr.querySelectorAll('.rail li').forEach(li => li.className = 'is-done');\n                    estadoTarjeta('is-ok'); boton('ok', 'Acceso concedido');\n                    if (!herramientas.length) {\n                        mensaje('Tu clave es válida, pero no tienes herramientas asignadas para <b>' + esc(WEB) + '<\/b>.', true);\n                        setTimeout(() => cerrar(continuar), 2200);\n                        return;\n                    }\n                    setTimeout(() => transformar(herramientas, continuar), 650);\n                },\n                no: (error) => {\n                    enviando = false; inp.disabled = false;\n                    paso(1, 'is-bad'); estadoTarjeta('is-bad'); boton('warn', 'Acceso denegado');\n                    explicar(error);\n                    setTimeout(() => { if (abierta) { boton(null, 'Entrar'); estadoTarjeta(null); } }, 2600);\n                    inp.select(); inp.focus();\n                },\n                red: (texto) => {\n                    enviando = false; inp.disabled = false;\n                    paso(1, 'is-bad'); estadoTarjeta('is-bad'); boton('warn', 'Sin respuesta');\n                    mensaje(esc(texto), true);\n                    setTimeout(() => { if (abierta) { boton(null, 'Reintentar'); estadoTarjeta(null); paso(0); } }, 2200);\n                }\n            });\n        }\n\n        function abrir(opciones) {\n            if (abierta) return;\n            opciones = opciones || {};\n            try {\n                raiz = document.createElement('iatel-acceso');\n                raiz.style.cssText = 'all: initial; position: fixed; inset: 0; z-index: 2147483647;';\n                sr = raiz.attachShadow({ mode: 'closed' });\n                hojaDeEstilos(sr);\n                const tpl = document.createElement('template'); tpl.innerHTML = marco();\n                sr.appendChild(tpl.content);\n                (document.body || document.documentElement).appendChild(raiz);\n            } catch (e) {\n                // Sin Shadow DOM: se mantiene el aviso clásico\n                raiz = null; sr = null;\n                if (opciones.error) { alert('Oceane Pro (Acceso Denegado): ' + opciones.error); return; }\n                const input = prompt(\"IATEL: Introduce tu clave de acceso para Oceane Pro:\");\n                if (input && !GM_getValue(\"oceane_clave\")) { GM_setValue(\"oceane_clave\", input.trim()); validar(); }\n                return;\n            }\n            abierta = true; enviando = false;\n            const inp = $('#acc-k');\n\n            $('[data-a=\"entrar\"]').addEventListener('click', enviar);\n            inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); enviar(); } });\n            inp.addEventListener('input', () => { $('.field').classList.remove('is-bad'); if (!$('#acc-m').hidden && !$('[data-a=\"equipo\"]').classList.contains('is-hot')) mensaje(null); });\n            $('[data-a=\"ver\"]').addEventListener('click', (e) => {\n                const ver = inp.type === 'password'; inp.type = ver ? 'text' : 'password';\n                e.currentTarget.innerHTML = ico(ver ? 'eyeOff' : 'eye', 17); e.currentTarget.setAttribute('aria-label', ver ? 'Ocultar la clave' : 'Mostrar la clave'); inp.focus();\n            });\n            $('[data-a=\"pegar\"]').addEventListener('click', async () => {\n                try { const t = await navigator.clipboard.readText(); if (t) { inp.value = t.trim(); inp.dispatchEvent(new Event('input')); } } catch (e) { mensaje('El navegador no deja leer el portapapeles: pega la clave con <b>Ctrl + V<\/b>.', true); }\n                inp.focus();\n            });\n            $('[data-a=\"equipo\"]').addEventListener('click', (e) => {\n                const b = e.currentTarget; GM_setClipboard(String(GM_getValue('oceane_hwid', '')));\n                b.classList.add('is-ok'); const antes = b.innerHTML; b.innerHTML = ico('check', 13) + 'Identificador copiado';\n                setTimeout(() => { if (abierta) { b.classList.remove('is-ok'); b.innerHTML = antes; } }, 1800);\n            });\n            $('[data-a=\"luego\"]').addEventListener('click', () => cerrar());\n            alTeclado = (e) => { if (e.key === 'Escape' && abierta && !enviando) { e.stopPropagation(); cerrar(); } };\n            document.addEventListener('keydown', alTeclado, true);\n\n            red();\n            if (opciones.error) { paso(1, 'is-bad'); estadoTarjeta('is-bad'); explicar(opciones.error); }\n            setTimeout(() => { if (abierta) inp.focus(); }, 300);\n\n            // Otra pestaña ha guardado la clave: esta se activa sola\n            vigia = setInterval(() => {\n                if (!abierta || enviando) return;\n                if (GM_getValue(\"oceane_clave\", \"\") && !opciones.error) cerrar(() => validar());\n            }, 1200);\n        }\n\n        return { abrir: abrir };\n    })();\n\n    if (!GM_getValue(\"oceane_clave\", \"\")) {\n        Acceso.abrir();\n    } else {\n        arrancarDesdeCache();\n        validar();\n    }\n})();\n";
function resaltarLoader(t) {
    return esc(t).split('\n').map(l => {
        if (/^\s*\/\//.test(l)) return '<span class="c">' + l + '</span>';
        return l.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="s">$1</span>')
                .replace(/\b(const|let|function|return|if|else|try|catch|new|typeof)\b/g, '<span class="k">$1</span>');
    }).join('\n');
}

                    <p>Tus herramientas aparecen solas en cada web. Cuando publicamos una versión nueva, se aplica al recargar la página: no hay que reinstalar nada.</p></div></li>
            </ol>
            <aside class="ws-aside">

function montarInstalacion(raiz) {
    const copiarLoader = async (e) => { const b = e.currentTarget; const ok = await copiar(LOADER); btnMsg(b, ok ? 'Código copiado' : 'No se pudo copiar', ok ? 'success' : 'warning', 2200); };
    $('#ld-copiar', raiz).onclick = copiarLoader;
    $('#ld-copiar2', raiz).onclick = copiarLoader;
    $('#ld-ver', raiz).onclick = (e) => {
        const panel = $('#ld-codigo', raiz), b = e.currentTarget, abrir = panel.hidden;
        panel.hidden = !abrir; b.setAttribute('aria-expanded', abrir);
        b.querySelector('span').textContent = abrir ? 'Ocultar código' : 'Ver código';
        if (abrir) anim(panel, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 360 });
    };
}

function vistaNoEncontrada() {
    return `<section class="ws-page"><div class="ws-wrap"><div class="ia-empty" style="padding:64px">${icono('compass', 28)}<h2 style="margin:16px 0 8px;font-size:22px">Esta página no existe</h2><p style="margin-bottom:20px">Puede que la herramienta haya cambiado de nombre.</p><a class="ia-btn ia-btn--primary ia-btn--md" href="#/herramientas">Ver herramientas</a></div></div></section>`;
}

/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
const vista = $('#vista');
const nav = $('#nav'), navInd = $('#nav-ind');
const TITULOS = { inicio: 'Inicio', novedades: 'Novedades', instalacion: 'Instalación', herramientas: 'Herramientas', simulador: 'Pruébalas' };
function marcarNav(clave) {
    $$('.ia-btn', nav).forEach(a => { const on = a.dataset.ruta === clave; if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $$('.ia-menu-item', $('#menu-movil')).forEach(a => a.classList.toggle('is-active', a.dataset.ruta === clave));
    $('#bar-title').textContent = TITULOS[clave] || 'IATEL';
    const act = $(`.ia-btn[data-ruta="${clave}"]`, nav);
    if (act) { navInd.style.opacity = 1; navInd.style.width = act.offsetWidth + 'px'; navInd.style.transform = `translateX(${act.offsetLeft}px)`; }
    else navInd.style.opacity = 0;
}
let rutaActual = null, observador = null;
function observarReveal(raiz) {
    if (observador) observador.disconnect();
    if (reducido() || !('IntersectionObserver' in window)) {
        $$('.ws-reveal', raiz).forEach(e => e.classList.add('is-in'));
        $$('[data-cuenta]', raiz).forEach(contar);
        return;
    }
    observador = new IntersectionObserver((ents) => ents.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.classList.add('is-in'); observador.unobserve(en.target);
        $$('[data-cuenta]', en.target).forEach(contar);
    }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    $$('.ws-reveal', raiz).forEach(e => observador.observe(e));
}
function contar(el) {
    const fin = +el.dataset.cuenta; if (el._contado) return; el._contado = true;
    if (reducido()) { el.textContent = fin; return; }
    const t0 = performance.now(), d = 900;
    const paso = (t) => { const p = Math.min(1, (t - t0) / d); el.textContent = Math.round(fin * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
}
function route() {
    const hash = decodeURIComponent((location.hash || '#/').slice(1)) || '/';
    const partes = hash.split('/').filter(Boolean);
    const seccion = partes[0] || 'inicio';
    let html = '', montar = null, claveNav = seccion, anclaje = null, clave = hash;
    if (seccion === 'inicio' || seccion === 'novedades') { html = vistaInicio(); montar = (r) => { hidratarTarjetas(r); montarEscenas(r); cargarNovedades(r); montarSimulador(r); }; anclaje = seccion === 'inicio' ? null : seccion; clave = '/'; }
    else if (seccion === 'herramientas' && partes[1]) { const h = herramienta(partes[1]); html = vistaFicha(h); montar = h ? (r) => montarFicha(r, h) : null; claveNav = 'herramientas'; }
    else if (seccion === 'herramientas') { html = vistaCatalogo(); montar = montarCatalogo; }
    else if (seccion === 'instalacion') { html = vistaInstalacion(); montar = montarInstalacion; }
    else if (seccion === 'simulador') { const id = SIMS[partes[1]] ? partes[1] : 'oceane'; html = vistaSimulador(id); montar = (r) => montarSimulador(r); claveNav = 'simulador'; clave = '/simulador'; }
    else { html = vistaNoEncontrada(); claveNav = null; }

    const misma = rutaActual === clave;
    rutaActual = clave;
    marcarNav(anclaje || claveNav);
    cerrarMenu();
    document.title = (TITULOS[anclaje || claveNav] && claveNav !== 'inicio' ? TITULOS[anclaje || claveNav] + ' · ' : '') + 'iATEL · Herramientas';
    // Misma página de inicio: solo hay que desplazarse al ancla
    if (misma && clave === '/') { irA(anclaje); return; }
    const pintar = () => {
        pararEscenas(); demoTimers.forEach(clearInterval); demoTimers = [];
        vista.innerHTML = html;
        if (montar) montar(vista);
        observarReveal(vista);
        if (anclaje) requestAnimationFrame(() => irA(anclaje, true));
        else if (clave === '/' && introVista()) { const it = $('#intro'); window.scrollTo({ top: it ? it.offsetTop + it.offsetHeight - window.innerHeight : 0, behavior: 'instant' }); }
        else window.scrollTo({ top: 0, behavior: 'instant' });
        anim(vista, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 420 });
    };
    if (vista.firstElementChild && !reducido()) {
        const a = anim(vista, [{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease-in', fill: 'forwards' });
        if (a) a.onfinish = () => { a.cancel(); pintar(); }; else pintar();
    } else pintar();
}
/* La entrada con el logo se ve completa la primera vez de cada sesión; al volver a Inicio se empieza en la portada */
const introVista = () => { try { return sessionStorage.getItem('ws-intro') === '1'; } catch (e) { return false; } };
function marcarIntroVista() { try { sessionStorage.setItem('ws-intro', '1'); } catch (e) {} }
function irA(id, instantaneo) {
    if (!id) { window.scrollTo({ top: 0, behavior: reducido() ? 'auto' : 'smooth' }); return; }
    const el = document.getElementById(id); if (!el) return;
    $$('.ws-reveal', el).forEach(x => x.classList.add('is-in'));
    el.scrollIntoView({ behavior: instantaneo || reducido() ? 'auto' : 'smooth' });
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => marcarNav($('.ia-btn[aria-current]', nav) ? $('.ia-btn[aria-current]', nav).dataset.ruta : null));
// En Inicio, la barra sigue la sección visible (Novedades)
window.addEventListener('scroll', () => {
    if (rutaActual !== '/') return;
    const y = window.scrollY + 140;
    const sec = ['novedades'].find(id => { const e = document.getElementById(id); return e && e.offsetTop <= y; });
    const actual = $('.ia-btn[aria-current]', nav), quiere = sec || 'inicio';
    if (!actual || actual.dataset.ruta !== quiere) marcarNav(quiere);
}, { passive: true });

/* Menú en móvil (mismo menú desplegable del sistema) */
const menuBtn = $('#menu-btn'), menuMovil = $('#menu-movil');
menuBtn.innerHTML = icono('menu', 18);
menuMovil.innerHTML = Object.keys(TITULOS).map(k => `<a class="ia-menu-item" role="menuitem" href="#/${k === 'inicio' ? '' : k}" data-ruta="${k}">${esc(TITULOS[k])}</a>`).join('');
function cerrarMenu() { menuMovil.classList.remove('is-open'); menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.onclick = (e) => { e.stopPropagation(); const ab = !menuMovil.classList.contains('is-open'); menuMovil.classList.toggle('is-open', ab); menuBtn.setAttribute('aria-expanded', ab); };
document.addEventListener('click', (e) => { if (!e.target.closest('.ws-menu-wrap')) cerrarMenu(); });

/* Brillo que sigue al cursor en las tarjetas */
document.addEventListener('pointermove', (e) => {
    const c = e.target.closest && e.target.closest('.ws-card'); if (!c) return;
    const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });

route();
requestAnimationFrame(() => marcarNav($('.ia-btn[aria-current]', nav) ? $('.ia-btn[aria-current]', nav).dataset.ruta : 'inicio'));
})();
</script>
